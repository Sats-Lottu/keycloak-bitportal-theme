name: keycloak-bitportal-theme
services:
  keycloak:
    build:
      context: .
    command: [start-dev, --import-realm]
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/8080
          printf 'GET /realms/bitportal/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost:8080\r\nConnection: close\r\n\r\n' >&3
          read -r status <&3
          [[ "$$status" == *" 200 "* ]]
      interval: 3s
      timeout: 3s
      start_period: 10s
      retries: 50
  tests:
    profiles: [test]
    build:
      context: .
      dockerfile: tests/Dockerfile
    network_mode: service:keycloak
    depends_on:
      keycloak:
        condition: service_healthy
